name: Nexus Windows

on:
  push:
    branches: [main, 'work/**', 'nexus-startup-*']
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  pull_request:
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nexus:
    name: Nexus atual — Windows, contratos e arranque
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar dependencias Nexus fixadas
        shell: pwsh
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Gate de runtime local permitido
        shell: pwsh
        run: python -m pytest nexus/tests/test_no_forbidden_legacy_runtime.py -q -p no:cacheprovider -o pythonpath=.
      - name: Script PowerShell 5 - suites Lab e falha diagnosticada
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          python -m pytest nexus/tests/test_windows_stack_structural_300k.py -q -p no:cacheprovider -o pythonpath=.
          if ($LASTEXITCODE -ne 0) { throw '300K structural compatibility gate failed' }
          Write-Output 'NEXUS_STRUCTURAL_300000=PASS'
          foreach ($suite in @('core', 'blocks', 'practical')) {
            $report = Join-Path $env:RUNNER_TEMP ('nexus-' + $suite)
            powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath $python -Suite $suite -ReportDirectory $report
            if ($LASTEXITCODE -ne 0) {
              Get-ChildItem -LiteralPath $report -Filter '*.txt' | ForEach-Object { Get-Content -LiteralPath $_.FullName }
              throw "Suite $suite failed"
            }
            $state = Get-Content (Join-Path $report 'state.json') -Raw | ConvertFrom-Json
            if ($state.status -ne 'PASS' -or $state.suite -ne $suite) { throw "Missing PASS report for $suite" }
            $stage = 'TESTS-' + $suite.ToUpperInvariant()
            Get-Content (Join-Path $report ($stage + '.stdout.txt'))
            Write-Output ("NEXUS_SUITE_" + $suite.ToUpperInvariant() + "=PASS")
          }
          $bad = Join-Path $env:RUNNER_TEMP 'nexus-fail'
          powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath 'NEXUS-MISSING-PYTHON.exe' -ReportDirectory $bad
          if ($LASTEXITCODE -eq 0) { throw 'Missing Python was accepted' }
          $failure = Get-Content "$bad/state.json" -Raw | ConvertFrom-Json
          if ($failure.status -ne 'FAIL' -or -not $failure.error) { throw 'Missing failure diagnosis' }
          Write-Output 'POWERSHELL_WRAPPER=PASS (staged suites + missing executable)'
          exit 0
      - name: Delimitar evidencia
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Suites Nexus core, blocks e practical executadas num runner Windows; regressao integral nos jobs complementares. Practical cobre apenas contratos reais ja automatizados. Nao prova a instalacao no PC de Pedro, Open Notebook/tiny, LibreOffice real, ACL da conta Nexus, homelab ou o produto completo.'

  regression:
    name: Nexus Windows — standard regression partition ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: '0', primary: 0, slice_count: 1, slice: 0}
          - {label: '1', primary: 1, slice_count: 1, slice: 0}
          - {label: '2a', primary: 2, slice_count: 4, slice: 0}
          - {label: '2b0', primary: 2, slice_count: 4, slice: 1}
          - {label: '2b1', primary: 2, slice_count: 4, slice: 1}
          - {label: '2b2', primary: 2, slice_count: 4, slice: 1}
          - {label: '2b3', primary: 2, slice_count: 4, slice: 1}
          - {label: '2b4', primary: 2, slice_count: 4, slice: 1}
          - {label: '2b5', primary: 2, slice_count: 4, slice: 1}
          - {label: '2c', primary: 2, slice_count: 4, slice: 2}
          - {label: '2d', primary: 2, slice_count: 4, slice: 3}
          - {label: '3', primary: 3, slice_count: 1, slice: 0}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NEXUS_REGRESSION_PRIMARY: ${{ matrix.primary }}
      NEXUS_REGRESSION_SLICE_COUNT: ${{ matrix.slice_count }}
      NEXUS_REGRESSION_SLICE: ${{ matrix.slice }}
      NEXUS_REGRESSION_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Complete standard regression on the same candidate
        shell: pwsh
        run: |
          # Same standard coverage; six volume modules remain in dedicated gates.
          $volume = @(
            'nexus/tests/test_product_flows_5000.py',
            'nexus/tests/test_product_system_50000.py',
            'nexus/tests/test_product_themes_canonical_200k.py',
            'nexus/tests/test_public_product_routes_10000.py',
            'nexus/tests/test_public_product_routes_all_50000.py',
            'nexus/tests/test_windows_stack_structural_300k.py'
          )
          $modules = @(Get-ChildItem -LiteralPath nexus/tests -File -Recurse |
            Where-Object { $_.Name -like 'test_*.py' -or $_.Name -like '*_test.py' } |
            ForEach-Object { [IO.Path]::GetRelativePath($PWD.Path, $_.FullName).Replace('\', '/') } |
            Where-Object { $volume -notcontains $_ } | Sort-Object)
          $primary = [int]$env:NEXUS_REGRESSION_PRIMARY
          $sliceCount = [int]$env:NEXUS_REGRESSION_SLICE_COUNT
          $slice = [int]$env:NEXUS_REGRESSION_SLICE
          $label = $env:NEXUS_REGRESSION_LABEL
          # Keep the previous four-way catalogue exactly. Only former shard 2
          # is subdivided, so every module is selected once and only once.
          $primaryModules = @(for ($i = 0; $i -lt $modules.Count; $i++) {
            if (($i % 4) -eq $primary) { $modules[$i] }
          })
          $selected = @(for ($i = 0; $i -lt $primaryModules.Count; $i++) {
            if (($i % $sliceCount) -eq $slice) { $primaryModules[$i] }
          })
          # Split only original 2b, preserving its six modules without skipping tests.
          if ($label -match '^2b([0-5])$') {
            if ($selected.Count -ne 6) { throw '2b module count changed; revalidate the matrix' }
            $selected = @($selected[[int]$Matches[1]])
          }
          if ($modules.Count -eq 0 -or $selected.Count -eq 0) {
            throw 'Empty regression partition'
          }

          # Mechanical coverage proof: union equals the old catalogue and
          # intersections are empty. This executes on Windows in every job.
          $assigned = @{}
          foreach ($candidatePrimary in 0..3) {
            $candidateSlices = if ($candidatePrimary -eq 2) { 4 } else { 1 }
            $candidateModules = @(for ($i = 0; $i -lt $modules.Count; $i++) {
              if (($i % 4) -eq $candidatePrimary) { $modules[$i] }
            })
            foreach ($candidateSlice in 0..($candidateSlices - 1)) {
              for ($i = 0; $i -lt $candidateModules.Count; $i++) {
                if (($i % $candidateSlices) -eq $candidateSlice) {
                  $module = $candidateModules[$i]
                  if (-not $assigned.ContainsKey($module)) { $assigned[$module] = 0 }
                  $assigned[$module]++
                }
              }
            }
          }
          if ($assigned.Count -ne $modules.Count) {
            throw "Regression coverage union mismatch: $($assigned.Count) != $($modules.Count)"
          }
          $duplicates = @($assigned.GetEnumerator() | Where-Object { $_.Value -ne 1 })
          if ($duplicates.Count -ne 0) {
            throw ('Regression coverage overlap: ' + (($duplicates | ForEach-Object { $_.Key }) -join ', '))
          }

          New-Item -ItemType Directory -Force -Path windows-regression-evidence | Out-Null
          $progress = Join-Path windows-regression-evidence ("progress-" + $label + ".txt")
          Set-Content -LiteralPath $progress -Value ("TOTAL=" + $modules.Count + " PRIMARY=" + $primary + " SLICE=" + $slice + "/" + $sliceCount + " SELECTED=" + $selected.Count)
          Write-Output ("STANDARD_TOTAL_MODULES=" + $modules.Count + " PARTITION=" + $label + " SELECTED=" + $selected.Count)
          $selected | ForEach-Object { Write-Output ("STANDARD_MODULE=" + $_) }

          # Execute one module at a time. If a future timeout occurs, the live
          # log identifies the last module started instead of hiding it inside
          # one long pytest invocation.
          foreach ($module in $selected) {
            $safe = ($module -replace '[^A-Za-z0-9_.-]', '_')
            Add-Content -LiteralPath $progress -Value ("START " + $module)
            Write-Output ("STANDARD_START=" + $module)
            $started = Get-Date
            python -m pytest $module -vv -p no:cacheprovider -o pythonpath=. --durations=20 ("--junitxml=windows-regression-evidence/" + $safe + ".xml")
            $code = $LASTEXITCODE
            $elapsed = [Math]::Round(((Get-Date) - $started).TotalSeconds, 2)
            Add-Content -LiteralPath $progress -Value ("END " + $module + " EXIT=" + $code + " SECONDS=" + $elapsed)
            Write-Output ("STANDARD_END=" + $module + " EXIT=" + $code + " SECONDS=" + $elapsed)
            if ($code -ne 0) { throw ("Regression module failed: " + $module) }
          }
          Write-Output ("NEXUS_SUITE_ALL_STANDARD_PARTITION_" + $label + "=PASS")
      - name: Preserve complete regression evidence even on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-standard-regression-evidence-${{ matrix.label }}
          path: windows-regression-evidence/
          if-no-files-found: error
