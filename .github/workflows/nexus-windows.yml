name: Nexus Windows

on:
  push:
    branches: [main, 'work/**', 'nexus-startup-*']
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  pull_request:
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nexus:
    name: Nexus atual — Windows, contratos e arranque
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar dependencias Nexus fixadas
        shell: pwsh
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Script PowerShell 5 - suites Lab e falha diagnosticada
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          foreach ($suite in @('core', 'blocks', 'all', 'practical')) {
            $report = Join-Path $env:RUNNER_TEMP ('nexus-' + $suite)
            powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath $python -Suite $suite -ReportDirectory $report
            if ($LASTEXITCODE -ne 0) {
              Get-ChildItem -LiteralPath $report -Filter '*.txt' | ForEach-Object { Get-Content -LiteralPath $_.FullName }
              throw "Suite $suite failed"
            }
            $state = Get-Content (Join-Path $report 'state.json') -Raw | ConvertFrom-Json
            if ($state.status -ne 'PASS' -or $state.suite -ne $suite) { throw "Missing PASS report for $suite" }
            $stage = if ($suite -eq 'all') { 'TESTS' } else { 'TESTS-' + $suite.ToUpperInvariant() }
            Get-Content (Join-Path $report ($stage + '.stdout.txt'))
            Write-Output ("NEXUS_SUITE_" + $suite.ToUpperInvariant() + "=PASS")
          }
          $bad = Join-Path $env:RUNNER_TEMP 'nexus-fail'
          powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath 'NEXUS-MISSING-PYTHON.exe' -ReportDirectory $bad
          if ($LASTEXITCODE -eq 0) { throw 'Missing Python was accepted' }
          $failure = Get-Content "$bad/state.json" -Raw | ConvertFrom-Json
          if ($failure.status -ne 'FAIL' -or -not $failure.error) { throw 'Missing failure diagnosis' }
          Write-Output 'POWERSHELL_WRAPPER=PASS (staged suites + missing executable)'
          exit 0
      - name: Delimitar evidencia
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Suites Nexus core, blocks, practical e all executadas num runner Windows. Practical cobre apenas contratos reais ja automatizados. Nao prova a instalacao no PC de Pedro, Open Notebook/tiny, LibreOffice real, ACL da conta Nexus, homelab ou o produto completo.'
