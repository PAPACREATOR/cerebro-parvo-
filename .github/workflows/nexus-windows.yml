name: Nexus Windows

on:
  push:
    branches: [main, 'work/**', 'nexus-startup-*']
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  pull_request:
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nexus:
    name: Nexus atual — Windows, contratos e arranque
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar dependencias Nexus fixadas
        shell: pwsh
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Script PowerShell 5 - sucesso e falha diagnosticada
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $report = Join-Path $env:RUNNER_TEMP 'nexus-pass'
          powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath $python -ReportDirectory $report
          if ($LASTEXITCODE -ne 0) { Get-Content "$report/*.txt"; throw 'Script failed' }
          $state = Get-Content "$report/state.json" -Raw | ConvertFrom-Json
          if ($state.status -ne 'PASS') { throw 'Missing PASS report' }
          Get-Content "$report/TESTS.stdout.txt"
          $bad = Join-Path $env:RUNNER_TEMP 'nexus-fail'
          powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath 'NEXUS-MISSING-PYTHON.exe' -ReportDirectory $bad
          if ($LASTEXITCODE -eq 0) { throw 'Missing Python was accepted' }
          $failure = Get-Content "$bad/state.json" -Raw | ConvertFrom-Json
          if ($failure.status -ne 'FAIL' -or -not $failure.error) { throw 'Missing failure diagnosis' }
          Write-Output 'POWERSHELL_WRAPPER=PASS (success + missing executable)'
          exit 0
      - name: Delimitar evidencia
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Suite Nexus executada num runner Windows, com ferramentas deterministicas reais e falhas controladas. Nao prova a instalacao no PC de Pedro, Open Notebook/tiny, LibreOffice real, ACL da conta Nexus ou o produto completo.'
