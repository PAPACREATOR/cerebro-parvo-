name: Nexus Optional AI Studio Gateway

on:
  pull_request:
    paths:
      - 'server.js'
      - 'package.json'
      - 'nexus/tests/gateway_transport.test.cjs'
      - 'nexus/tests/test_single_runtime_boundary.py'
      - 'nexus/ui/index.html'
      - '.github/workflows/nexus-gateway.yml'
  push:
    branches:
      - 'fix/single-runtime-boundary-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-transport:
    name: Python authority and Node gateway
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify gateway JavaScript syntax
        run: node --check server.js
      - name: Install optional gateway dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: HTTP forwarding and authority E2E with Python-backend stub
        run: npm test
      - name: Install Python regression dependency
        run: python -m pip install pytest==8.3.5
      - name: Single authority and original sealed HTML
        run: python -m pytest nexus/tests/test_single_runtime_boundary.py -q -o pythonpath=.
