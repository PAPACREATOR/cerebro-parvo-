name: Spiff vs Conductor 500 Lab

on:
  push:
    branches: ['lab-spiff-conductor-compare-*']
    paths:
      - 'nexus/tests/test_spiff_vs_conductor_500.py'
      - '.github/workflows/spiff-vs-conductor-500.yml'
  pull_request:
    paths:
      - 'nexus/tests/test_spiff_vs_conductor_500.py'
      - '.github/workflows/spiff-vs-conductor-500.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed Lab dependencies
        run: |
          python -m pip install -r nexus/requirements-spiff-test.txt
          python -m pip install "open-notebook-mcp @ git+https://github.com/Epochal-dev/open-notebook-mcp.git@a2cddbf65cba8c4c8de7be16566781b7612a9545"
      - name: Compare identical 500 cases
        run: python -m pytest nexus/tests/test_spiff_vs_conductor_500.py -q -s -o pythonpath=.
