name: Nexus behavioral sessions

on:
  pull_request:
    paths:
      - 'nexus/tests/test_behavioral_sessions_matrix.py'
      - '.github/workflows/nexus-behavioral-sessions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal:
    name: Folha temporal behaviour (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Run real HTTP ticket and restart simulations
        run: python -m pytest nexus/tests/test_behavioral_sessions_matrix.py -q -p no:cacheprovider -o pythonpath=. --durations=10
      - name: Bound the evidence claim
        shell: bash
        run: |
          echo 'Behavioural simulations use the real Folha HTTP, parser and tickets, with external Host.start dispatch intercepted. They do not prove physical PC installation, durable Folha editing, OpenNotebook backend, WAV/MP4 or real tool execution.' >> "$GITHUB_STEP_SUMMARY"
