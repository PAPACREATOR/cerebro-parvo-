name: LibreOffice Writer Real

on:
  push:
    branches: ['lab-open-notebook-avatar-*']
    paths:
      - 'nexus/adapters/office.py'
      - 'nexus/tests/test_office.py'
      - 'nexus/tests/test_writer_real_libreoffice.py'
      - 'nexus/tests/fixtures/writer-fixed-test.ott'
      - 'nexus/docs/F007-LIBREOFFICE.md'
      - 'nexus/docs/CAPABILITY-WRITER-EDITORIAL.md'
      - '.github/workflows/libreoffice-writer-real.yml'
  pull_request:
    paths:
      - 'nexus/adapters/office.py'
      - 'nexus/tests/test_office.py'
      - 'nexus/tests/test_writer_real_libreoffice.py'
      - 'nexus/tests/fixtures/writer-fixed-test.ott'
      - 'nexus/docs/F007-LIBREOFFICE.md'
      - 'nexus/docs/CAPABILITY-WRITER-EDITORIAL.md'
      - '.github/workflows/libreoffice-writer-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer:
    name: Real Writer ODT round-trip and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_REAL_WRITER: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install LibreOffice Writer from runner distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
      - name: Install pytest
        run: python -m pip install pytest
      - name: Real LibreOffice Writer gate
        run: python -m pytest nexus/tests/test_writer_real_libreoffice.py -q -p no:cacheprovider -o pythonpath=.

  writer-windows:
    name: Real Writer Windows — fixed template round-trip
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXUS_REAL_WRITER: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned LibreOffice Writer on Windows
        shell: pwsh
        run: |
          choco install libreoffice-fresh --version=26.2.6 --yes --no-progress
          $exe = 'C:\Program Files\LibreOffice\program\soffice.com'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'LibreOffice soffice.com not found' }
          & $exe --version
          "LIBREOFFICE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pytest
        run: python -m pip install pytest
      - name: Real LibreOffice Writer Windows gate
        run: python -m pytest nexus/tests/test_writer_real_libreoffice.py -q -p no:cacheprovider -o pythonpath=.
