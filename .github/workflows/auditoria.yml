name: Auditoria e suites
on:
  push:
    branches: [main, 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auditoria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidencia:
    name: Integridade + suite histórica + persistência ativa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verificar preservacao e links ativos
        run: python ferramentas/verificar_documentacao.py
      - name: Instalar dependencias de auditoria
        run: python -m pip install -r requirements-auditoria.txt
      - name: Reproduzir suite historica recebida
        working-directory: implementacao/candidata-2026-09-27
        run: python -m pytest -q --color=no
      - name: Testar writer recuperavel ativo
        working-directory: implementacao/ativa-2026-09-28
        run: python -m pytest -q --color=no
      - name: Declarar limite da evidencia
        run: echo 'PASS cobre suite historica e writer recuperavel. Nao prova Activepieces, Open Notebook, Windows ou E2E.' >> "$GITHUB_STEP_SUMMARY"
