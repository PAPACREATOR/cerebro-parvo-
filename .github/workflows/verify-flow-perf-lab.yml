name: Verify Flow Performance Lab

on:
  push:
    branches: ['lab-conductor-verify-perf-*']
    paths:
      - 'nexus/tests/test_verify_flow_performance.py'
      - 'nexus/tests/fixtures/verify_optimized_lab.yaml'
      - '.github/workflows/verify-flow-perf-lab.yml'
  pull_request:
    paths:
      - 'nexus/tests/test_verify_flow_performance.py'
      - 'nexus/tests/fixtures/verify_optimized_lab.yaml'
      - '.github/workflows/verify-flow-perf-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Compare official and optimized verify flow
        run: python -m pytest nexus/tests/test_verify_flow_performance.py -q -s -o pythonpath=.
