name: Nexus Windows CI

on:
  push:
    branches:
      - audit/nexus-windows-ci-20261001
    paths:
      - 'nexus/**'
      - '.github/workflows/nexus-windows-ci.yml'
  pull_request:
    paths:
      - 'nexus/**'
      - '.github/workflows/nexus-windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nexus-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Run Nexus tests
        run: python -m pytest nexus/tests -q -o pythonpath=.
