name: Molde isolated diagnostic
on:
  push:
    branches: [lab/molde-diagnostic-20261013]
permissions:
  contents: read
jobs:
  diagnostic:
    name: Source projection diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Bounded diagnostic with thread stacks
        shell: python
        run: |
          import subprocess
          import sys
          command = [sys.executable, "-m", "pytest",
                     "nexus/tests/test_molde_universal.py", "-vv", "-p", "no:cacheprovider",
                     "-o", "pythonpath=.", "-o", "faulthandler_timeout=45"]
          try:
              result = subprocess.run(command, capture_output=True, text=True,
                                      encoding="utf-8", errors="replace", timeout=120)
          except subprocess.TimeoutExpired as error:
              for output in (error.stdout, error.stderr):
                  if output:
                      print(output.decode("utf-8", "replace") if isinstance(output, bytes) else output)
              raise SystemExit("FAIL: diagnostic exceeded 120 seconds")
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          raise SystemExit(result.returncode)
