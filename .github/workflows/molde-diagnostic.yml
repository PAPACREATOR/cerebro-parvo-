name: Molde isolated diagnostic
on:
  push:
    branches: [lab/molde-diagnostic-20261013]
permissions:
  contents: read
jobs:
  diagnostic:
    name: Source projection diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Pure source projection probe
        shell: python
        run: |
          import hashlib
          from nexus.adapters.constitutional import build_molde
          value = build_molde("original")
          assert value["source"]["sha256"] == hashlib.sha256(b"original").hexdigest()
          assert value["process"]["authority"] == "NONE"
          print("PURE_SOURCE_PROJECTION_PASS", flush=True)
      - name: Bounded diagnostic with persistent output
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          command = [sys.executable, "-m", "pytest",
                     "nexus/tests/test_molde_universal.py", "-vv", "-p", "no:cacheprovider",
                     "-o", "pythonpath=.", "-o", "faulthandler_timeout=45"]
          log_path = pathlib.Path(tempfile.gettempdir()) / "nexus-molde-diagnostic.log"
          timed_out = False
          with log_path.open("w", encoding="utf-8") as output:
              process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                         env={**os.environ, "PYTHONUNBUFFERED": "1"})
              try:
                  code = process.wait(timeout=120)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  process.kill()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      pass
                  code = 1
          print(log_path.read_text(encoding="utf-8", errors="replace"), flush=True)
          if timed_out:
              print("FAIL: diagnostic exceeded 120 seconds", flush=True)
          raise SystemExit(code)
