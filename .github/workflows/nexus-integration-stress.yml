name: Nexus Integration Stress

on:
  push:
    branches: ['lab-open-notebook-avatar-*']
    paths:
      - 'nexus/**'
      - '.github/workflows/nexus-integration-stress.yml'
  pull_request:
    paths:
      - 'nexus/**'
      - '.github/workflows/nexus-integration-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: 100K blocks + MCP + OpenNotebook E2E
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Block A — 100000 deterministic Kernel contracts
        run: python -m pytest nexus/tests/test_stress_matrix_100k.py -q -p no:cacheprovider -o pythonpath=.
      - name: Block B — 100000 natural ambiguity cases
        run: python -m pytest nexus/tests/test_natural_ambiguity_100k.py -q -p no:cacheprovider -o pythonpath=.
      - name: Block C — real MCP stdio 1000 + real OpenNotebook MCP package
        run: python -m pytest nexus/tests/test_mcp_client_1000.py nexus/tests/test_open_notebook_mcp_real.py -q -p no:cacheprovider -o pythonpath=.
      - name: Block D — Kernel to MCP to OpenNotebook boundary to Canonical E2E
        run: python -m pytest nexus/tests/test_open_notebook_kernel_e2e.py -q -p no:cacheprovider -o pythonpath=.
      - name: Block E — media installer contract and PowerShell parse
        shell: pwsh
        run: |
          python -m pytest nexus/tests/test_media_tools_installer.py -q -p no:cacheprovider -o pythonpath=.
          $raw = Get-Content -LiteralPath nexus/windows/install-media-tools.ps1 -Raw
          [void][scriptblock]::Create($raw)
          Write-Output 'MEDIA_INSTALLER_PARSE=PASS'
      - name: Block F — complete Nexus regression
        run: python -m pytest nexus/tests -q -p no:cacheprovider -o pythonpath=.
