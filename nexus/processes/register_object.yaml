workflow:
  name: nexus-register-object
  version: 1.0.0
  entry_point: read_object
  input:
    input_path: {type: string}
    python: {type: string}
  limits:
    max_iterations: 2
    timeout_seconds: 20
agents:
- name: read_object
  type: script
  command: '{{ workflow.input.python }}'
  args:
  - -I
  - '{{ workflow.dir }}/../adapters/constitutional.py'
  - '{{ workflow.input.input_path }}'
  stdin: ''
  timeout: 15
  routes:
  - to: $end
output:
  result: '{{ read_object.output.stdout }}'
