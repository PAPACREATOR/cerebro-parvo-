workflow:
  name: nexus-check
  version: "1.0.0"
  entry_point: hash_windows
  input:
    input_path: {type: string}
    powershell: {type: string}
  limits:
    max_iterations: 2
    timeout_seconds: 30
agents:
  - name: hash_windows
    type: script
    command: "{{ workflow.input.powershell }}"
    args:
      - "-NoProfile"
      - "-NonInteractive"
      - "-Command"
      - |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
        [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
        $p = [Console]::In.ReadToEnd().TrimEnd([char]10, [char]13)
        try {
          $algorithm = [System.Security.Cryptography.SHA256]::Create()
          try { $hash = [BitConverter]::ToString($algorithm.ComputeHash([System.IO.File]::ReadAllBytes($p))).Replace('-', '').ToLowerInvariant() }
          finally { $algorithm.Dispose() }
          @{status='PASS'; sha256=$hash; capability='windows.dotnet-sha256'} | ConvertTo-Json -Compress
        } catch {
          @{status='FAIL'; sha256=$null; capability='windows.dotnet-sha256'; error=$_.Exception.Message} | ConvertTo-Json -Compress
        }
    stdin: "{{ workflow.input.input_path }}"
    timeout: 15
    routes:
      - to: $end
output:
  result: "{{ hash_windows.output.stdout }}"
