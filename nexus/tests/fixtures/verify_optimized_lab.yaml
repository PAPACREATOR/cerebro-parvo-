workflow:
  name: nexus-verify-optimized-lab
  version: "0.1.0-lab"
  entry_point: hash_windows
  input:
    input_path: {type: string}
    powershell: {type: string}
    python: {type: string}
  limits:
    max_iterations: 6
    timeout_seconds: 60

agents:
  - name: hash_windows
    type: script
    command: "{{ workflow.input.powershell }}"
    args:
      - "-NoProfile"
      - "-NonInteractive"
      - "-Command"
      - |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
        [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
        $p = [Console]::In.ReadToEnd().TrimEnd([char]10, [char]13)
        try {
          $algorithm = [System.Security.Cryptography.SHA256]::Create()
          try { $hash = [BitConverter]::ToString($algorithm.ComputeHash([System.IO.File]::ReadAllBytes($p))).Replace('-', '').ToLowerInvariant() }
          finally { $algorithm.Dispose() }
          [Console]::Out.WriteLine('{"status":"PASS","sha256":"' + $hash + '","capability":"windows.dotnet-sha256"}')
        } catch {
          [Console]::Error.WriteLine($_.Exception.Message)
          [Console]::Out.WriteLine('{"status":"FAIL","sha256":null,"capability":"windows.dotnet-sha256","error":"Não foi possível ler o ficheiro."}')
        }
    stdin: "{{ workflow.input.input_path }}"
    timeout: 15
    routes:
      - to: hash_python

  - name: hash_python
    type: script
    command: "{{ workflow.input.python }}"
    args:
      - "-I"
      - "{{ workflow.dir }}/../adapters/tools.py"
      - hash
      - "{{ workflow.input.input_path }}"
    stdin: ""
    timeout: 15
    routes:
      - to: compare

  - name: compare
    type: set
    values:
      outcome: >-
        {% if hash_windows.output.status == 'FAIL' or hash_python.output.status == 'FAIL' %}failure{% elif hash_windows.output.status != 'PASS' or hash_python.output.status != 'PASS' or not hash_windows.output.sha256 or not hash_python.output.sha256 %}unknown{% elif hash_windows.output.sha256 == hash_python.output.sha256 %}agreement{% else %}conflict{% endif %}
      a: "{{ hash_windows.output | tojson }}"
      b: "{{ hash_python.output | tojson }}"
    routes:
      - to: report

  - name: report
    type: set
    values:
      status: >-
        {% if compare.output.outcome == 'agreement' %}PASS{% elif compare.output.outcome == 'failure' %}FAIL{% else %}UNKNOWN{% endif %}
      outcome: "{{ compare.output.outcome }}"
      title: "Verificação de conteúdo"
      markdown: >-
        # Verificação de conteúdo

        {% if compare.output.outcome == 'agreement' %}Os dois métodos obtiveram a mesma impressão digital do conteúdo.{% elif compare.output.outcome == 'conflict' %}Os métodos deram resultados diferentes. A divergência foi preservada.{% elif compare.output.outcome == 'unknown' %}Não há informação suficiente para confirmar a comparação.{% else %}Uma das verificações falhou. Os resultados disponíveis foram preservados.{% endif %}

        Esta verificação compara os bytes do ficheiro ou do texto. Não confirma a veracidade do conteúdo.

        Método 1: {{ hash_windows.output.status }}
        {{ hash_windows.output.sha256 or 'Sem resultado' }}

        Método 2: {{ hash_python.output.status }}
        {{ hash_python.output.sha256 or 'Sem resultado' }}
      evidence: >-
        {{ [
          {"capability": hash_windows.output.capability, "status": hash_windows.output.status, "value": hash_windows.output.sha256},
          {"capability": hash_python.output.capability, "status": hash_python.output.status, "value": hash_python.output.sha256}
        ] | tojson }}
      ai_calls: "0"
    routes:
      - to: $end

output:
  result: "{{ report.output | tojson }}"
