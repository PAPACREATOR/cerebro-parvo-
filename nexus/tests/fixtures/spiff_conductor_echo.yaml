workflow:
  name: nexus-spiff-conductor-echo
  version: "1.0.0"
  entry_point: echo
  input:
    case_id: {type: string}
    input_hash: {type: string}
    direction: {type: string}
    status: {type: string}
    ordinal: {type: integer}
  limits:
    max_iterations: 2
    timeout_seconds: 5
agents:
  - name: echo
    type: set
    values:
      case_id: "{{ workflow.input.case_id }}"
      input_hash: "{{ workflow.input.input_hash }}"
      direction: "{{ workflow.input.direction }}"
      status: "{{ workflow.input.status }}"
      ordinal: "{{ workflow.input.ordinal }}"
    routes:
      - to: $end
output:
  case_id: "{{ echo.output.case_id }}"
  input_hash: "{{ echo.output.input_hash }}"
  direction: "{{ echo.output.direction }}"
  status: "{{ echo.output.status }}"
  ordinal: "{{ echo.output.ordinal }}"
